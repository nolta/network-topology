# Copy this file to config.yaml and fill in your real community string.
# config.yaml is gitignored so credentials never get committed.

snmp_version: "2c"
community: "public"          # <-- replace with your real SNMPv2c community string
timeout_seconds: 3
retries: 1
max_repetitions: 10   # lower (e.g. 5) if your switches' SNMP agents are weak/embedded
pace_seconds: 0       # delay between each SNMP table walk on a switch, if agents choke on rapid requests
switch_retries: 1     # retry a switch's whole collection this many times before giving up on it

switches:
  - 10.10.50.10
  - 10.10.50.11
  - 10.10.50.12
  - 10.10.50.13
  - 10.10.50.14
  - 10.10.50.15
  - 10.10.50.16
